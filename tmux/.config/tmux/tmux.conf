# ==========================================
# 1. GENERAL & TERMINAL COLORS
# ==========================================
# Enable 24-bit true color and italics support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Increase scrollback buffer memory (default is 2000)
set -g history-limit 50000

# Remove ESC key delay in Vim/Neovim (improves response time)
set -s escape-time 0

# Increase display time for status messages and pane numbers
set -g display-time 2000

# ==========================================
# 2. INTERFACE & MOUSE
# ==========================================
# Enable full mouse support (clickable windows, panes, resizing)
set -g mouse on

# Start window and pane indexing at 1 instead of 0 (matches keyboard row layout)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# ==========================================
# 3. REMOTE CLIPBOARD PASSTHROUGH (OSC 52)
# ==========================================
# Allows copying text inside tmux/Vim over SSH straight to local laptop clipboard
set -s set-clipboard on

# ==========================================
# 4. KEYBINDINGS
# ==========================================
# Quick reload of tmux.conf
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

# Split panes using intuitive visual keys (| and -) opening in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes using Vim movement keys (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ==========================================
# 5. MINIMAL STATUS BAR
# ==========================================
set -g status-style bg=default,fg=colour245
set -g status-left-length 40
set -g status-left "#[fg=green,bold][#S] "
set -g status-right "#[fg=cyan]%H:%M #[fg=colour240]| #[fg=blue]%d-%b-%Y"
set -g window-status-current-style fg=yellow,bold
